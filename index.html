    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1.0.1" />

    <script>
      // Silence benign dev environment WebSocket disconnects in iframe/proxy environments
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          (event.reason.message && event.reason.message.includes('WebSocket')) ||
          (String(event.reason).includes('WebSocket'))
        )) {
          event.preventDefault();
        }
      });
    </script>
